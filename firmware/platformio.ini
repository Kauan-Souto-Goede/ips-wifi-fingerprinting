; Dois ambientes no mesmo projeto. Compile/grave um deles por vez:
;   pio run -e producao -t upload      (publica scans por MQTT)
;   pio run -e calibracao -t upload    (modo de calibracao pela Serial)

[env:producao]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_src_filter = +<main.cpp>

[env:calibracao]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
build_src_filter = +<calibracao.cpp>
